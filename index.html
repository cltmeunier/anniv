<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes anniversaires</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 2.5rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .card {
      background: #1e1e30;
      border: 1px solid #2d2d4e;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background: #12121f;
      border: 1px solid #3b3b5c;
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-size: 1.1rem;
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]::placeholder {
      color: #4a4a6a;
    }

    input[type="text"]:focus {
      border-color: #a78bfa;
    }

    button {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      transform: scale(0.97);
    }

    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.25rem;
    }

    #results {
      margin-top: 2rem;
      width: 100%;
      max-width: 480px;
      display: none;
    }

    #results.visible {
      display: block;
    }

    .age-summary {
      background: #1e1e30;
      border: 1px solid #2d2d4e;
      border-radius: 1rem;
      padding: 0.25rem 0;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .age-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.55rem 1.25rem;
      border-bottom: 1px solid #23233a;
      gap: 1rem;
    }

    .age-row:last-child {
      border-bottom: none;
    }

    .age-row .ag-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
    }

    .age-row .ag-value {
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      text-align: right;
    }

    .age-row.ag-main .ag-value {
      font-size: 1.05rem;
      color: #c4b5fd;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2d2d4e;
    }

    .section-days .section-title {
      color: #a78bfa;
    }

    .section-weeks .section-title {
      color: #60a5fa;
    }

    .section-months .section-title {
      color: #34d399;
    }

    .section-seconds .section-title {
      color: #fb923c;
    }

    .section-hours .section-title {
      color: #facc15;
    }

    .milestones {
      margin-bottom: 1.25rem;
      background: #1e1e30;
      border: 1px solid #2d2d4e;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    .milestone {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.4rem 0.9rem;
      border-bottom: 1px solid #23233a;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .milestone:last-child {
      border-bottom: none;
    }

    .milestone.past {
      opacity: 0.38;
    }

    .milestone.future {
      opacity: 0.65;
    }

    .milestone.next {
      background: #26183a;
    }

    .milestone .number {
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .section-days .milestone.next .number {
      color: #c4b5fd;
    }

    .section-weeks .milestone.next .number {
      color: #93c5fd;
    }

    .section-months .milestone.next .number {
      color: #6ee7b7;
    }

    .section-seconds .milestone.next .number {
      color: #fdba74;
    }

    .section-hours .milestone.next .number {
      color: #fde68a;
    }

    .milestone .date {
      color: #64748b;
      text-align: right;
      font-size: 0.85rem;
    }

    .milestone.next .date {
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 999px;
      margin-left: 0.4rem;
      vertical-align: middle;
      background: #7c3aed22;
      color: #a78bfa;
      border: 1px solid #7c3aed44;
    }

    .section-days {
      margin-bottom: 0.5rem;
    }

    .section-weeks {
      margin-bottom: 0.5rem;
    }

    .section-months {
      margin-bottom: 0.5rem;
    }

    .section-seconds {
      margin-bottom: 0.5rem;
    }

    .section-hours {
      margin-bottom: 0.5rem;
    }

    #next-global {
      display: none;
      border-radius: 1rem;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, #1a1030, #0d1e2e);
      position: relative;
      overflow: hidden;
    }

    #next-global::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--ng-color, #a78bfa), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .ng-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .ng-number {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .ng-date {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 0.6rem;
    }

    .ng-countdown {
      display: inline-block;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      padding: 0.25rem 0.9rem;
      font-size: 0.85rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem 0.75rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .subtitle {
        font-size: 0.875rem;
        margin-bottom: 1.75rem;
      }

      .card {
        padding: 1.25rem;
        border-radius: 0.75rem;
      }

      #next-global {
        padding: 1.25rem 1rem;
      }

      .ng-number {
        font-size: 1.5rem;
      }

      .milestone {
        flex-wrap: wrap;
        gap: 0.1rem;
      }

      .milestone .number {
        font-size: 0.85rem;
      }

      .milestone .date {
        width: 100%;
        text-align: left;
        font-size: 0.78rem;
        padding-bottom: 0.15rem;
      }

      .age-row {
        padding: 0.5rem 1rem;
      }

      .age-row .ag-value {
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>

  <h1>Vos anniversaires</h1>
  <p class="subtitle">Découvrez vos prochains jalons en jours, semaines et mois</p>

  <div class="card">
    <label for="dob">Date de naissance</label>
    <div class="input-row">
      <input type="text" id="dob" placeholder="jj/mm/aaaa" maxlength="10">
      <button onclick="calculate()">Calculer</button>
    </div>
    <div class="error" id="error"></div>
  </div>

  <div id="results">
    <div id="next-global"></div>
    <div class="age-summary" id="age-summary"></div>

    <div class="section-seconds">
      <div class="section-title">Secondes</div>
      <div class="milestones" id="milestones-seconds"></div>
    </div>

    <div class="section-hours">
      <div class="section-title">Heures</div>
      <div class="milestones" id="milestones-hours"></div>
    </div>

    <div class="section-days">
      <div class="section-title">Jours</div>
      <div class="milestones" id="milestones-days"></div>
    </div>

    <div class="section-weeks">
      <div class="section-title">Semaines</div>
      <div class="milestones" id="milestones-weeks"></div>
    </div>

    <div class="section-months">
      <div class="section-title">Mois</div>
      <div class="milestones" id="milestones-months"></div>
    </div>
  </div>

  <script>
    const MILESTONES_DAYS = [500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500, 8000, 8500, 9000, 9500, 10000, 15000, 20000, 25000, 30000, 35000, 40000, 45000, 50000];
    const MILESTONES_WEEKS = [100, 200, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
    const MILESTONES_MONTHS = [10, 25, 50, 100, 200, 500, 1000, 1500, 2000];
    const MILESTONES_SECONDS = [100_000, 500_000, 100_000_000, 200_000_000, 300_000_000, 500_000_000, 750_000_000, 800_000_000, 1_000_000_000, 1_250_000_000, 1_500_000_000, 2_000_000_000, 2_500_000_000, 3_000_000_000];
    const MILESTONES_HOURS = [10_000, 50_000, 100_000, 150_000, 200_000, 250_000, 300_000, 350_000, 400_000, 450_000, 500_000, 600_000, 700_000, 800_000];

    const input = document.getElementById('dob');

    input.addEventListener('input', () => {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
      if (v.length > 5) v = v.slice(0, 5) + '/' + v.slice(5);
      if (v.length > 10) v = v.slice(0, 10);
      input.value = v;
    });

    input.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

    function parseDate(str) {
      const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!m) return null;
      const [, dd, mm, yyyy] = m;
      const d = new Date(+yyyy, +mm - 1, +dd);
      if (isNaN(d) || d.getDate() !== +dd || d.getMonth() !== +mm - 1) return null;
      return d;
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function addMonths(date, n) {
      const d = new Date(date);
      d.setMonth(d.getMonth() + n);
      return d;
    }

    function addSeconds(date, n) {
      return new Date(date.getTime() + n * 1000);
    }

    function addHours(date, n) {
      return new Date(date.getTime() + n * 3_600_000);
    }

    function fmt(date) {
      return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function fmtShort(date) {
      return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function daysBetween(a, b) {
      return Math.round((b - a) / 86400000);
    }

    function monthsBetween(birth, now) {
      return (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
    }

    function buildMilestones(values, dateFn, unitLabel, now) {
      const all = values.map(n => ({ n, d: dateFn(n) }));
      const nextIdx = all.findIndex(m => m.d >= now);
      const start = nextIdx === -1 ? Math.max(0, all.length - 1) : Math.max(0, nextIdx - 1);
      const end = nextIdx === -1 ? all.length : nextIdx + 2;
      let nextFound = false;
      return all.slice(start, end).map(m => {
        let state;
        if (m.d < now) state = 'past';
        else if (!nextFound) { state = 'next'; nextFound = true; }
        else state = 'future';
        const diff = daysBetween(now, m.d);
        const label = m.d < now
          ? `le ${fmt(m.d)}`
          : diff === 0 ? "Aujourd'hui !" : `le ${fmt(m.d)} (dans ${diff} j)`;
        return { n: m.n, state, label, unitLabel, date: m.d, diff };
      });
    }

    const UNIT_COLORS = {
      'secondes': '#fdba74',
      'heures': '#fde68a',
      'jours': '#c4b5fd',
      'semaines': '#93c5fd',
      'mois': '#6ee7b7',
    };

    function renderNextGlobal(datasets) {
      const el = document.getElementById('next-global');
      const nextItems = datasets
        .flatMap(d => d)
        .filter(m => m.state === 'next');
      if (!nextItems.length) { el.style.display = 'none'; return; }

      nextItems.sort((a, b) => a.date - b.date);
      const m = nextItems[0];
      const color = UNIT_COLORS[m.unitLabel] || '#e2e8f0';
      const daysText = m.diff === 0
        ? "C'est aujourd'hui !"
        : `dans ${m.diff} jour${m.diff > 1 ? 's' : ''}`;

      el.style.setProperty('--ng-color', color);
      el.style.boxShadow = `0 0 32px ${color}22`;
      el.innerHTML =
        `<div class="ng-label">Prochain anniversaire</div>` +
        `<div class="ng-number" style="color:${color}">${m.n.toLocaleString('fr-FR')} ${m.unitLabel}</div>` +
        `<div class="ng-date">${fmt(m.date)}</div>` +
        `<div class="ng-countdown">${daysText}</div>`;
      el.style.display = 'block';
    }

    function renderMilestones(containerId, milestones) {
      const el = document.getElementById(containerId);
      el.innerHTML = '';
      for (const m of milestones) {
        const div = document.createElement('div');
        div.className = 'milestone ' + m.state;
        div.innerHTML =
          `<span class="number">${m.n.toLocaleString('fr-FR')} ${m.unitLabel}${m.state === 'next' ? '<span class="badge">prochain</span>' : ''}</span>` +
          `<span class="date">${m.label}</span>`;
        el.appendChild(div);
      }
    }

    function calculate() {
      document.getElementById('error').textContent = '';
      const birth = parseDate(input.value.trim());
      if (!birth) {
        document.getElementById('error').textContent = 'Date invalide. Format attendu : jj/mm/aaaa';
        return;
      }
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      if (birth > now) {
        document.getElementById('error').textContent = 'La date de naissance doit être dans le passé.';
        return;
      }

      const totalDays = daysBetween(birth, now);
      const totalWeeks = Math.floor(totalDays / 7);
      const totalMonths = monthsBetween(birth, now);
      const totalSeconds = Math.floor((now - birth) / 1000);
      const totalHours = Math.floor(totalSeconds / 3600);

      const years = Math.floor(totalDays / 365.25);
      const months = Math.floor((totalDays % 365.25) / 30.44);

      const row = (label, value, main = false) =>
        `<div class="age-row${main ? ' ag-main' : ''}">` +
        `<span class="ag-label">${label}</span>` +
        `<span class="ag-value">${value}</span>` +
        `</div>`;

      document.getElementById('age-summary').innerHTML =
        row('Âge', `${years} ans et ${months} mois`, true) +
        row('Secondes', totalSeconds.toLocaleString('fr-FR')) +
        row('Heures', totalHours.toLocaleString('fr-FR')) +
        row('Jours', totalDays.toLocaleString('fr-FR')) +
        row('Semaines', totalWeeks.toLocaleString('fr-FR')) +
        row('Mois', totalMonths.toLocaleString('fr-FR'));

      const dayData = buildMilestones(MILESTONES_DAYS, n => addDays(birth, n), 'jours', now);
      const weekData = buildMilestones(MILESTONES_WEEKS, n => addDays(birth, n * 7), 'semaines', now);
      const monthData = buildMilestones(MILESTONES_MONTHS, n => addMonths(birth, n), 'mois', now);
      const secondData = buildMilestones(MILESTONES_SECONDS, n => addSeconds(birth, n), 'secondes', now);
      const hourData = buildMilestones(MILESTONES_HOURS, n => addHours(birth, n), 'heures', now);

      renderNextGlobal([secondData, hourData, dayData, weekData, monthData]);

      renderMilestones('milestones-seconds', secondData);
      renderMilestones('milestones-hours', hourData);
      renderMilestones('milestones-days', dayData);
      renderMilestones('milestones-weeks', weekData);
      renderMilestones('milestones-months', monthData);

      const results = document.getElementById('results');
      results.classList.add('visible');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>

</html>
